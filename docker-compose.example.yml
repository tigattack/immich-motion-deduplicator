services:
  deduplicator:
    build:
      context: .
    image: immich-motion-deduplicator:latest
    working_dir: /work
    env_file:
      - .env
    environment:
      IMMICH_ROOT_DIR: /data
      IMMICH_SERVER_PATH_PREFIX: /data
    volumes:
      - ./:/work
      - /path/to/your/immich/data:/data:ro
    command: ["all", "--dry-run"]
